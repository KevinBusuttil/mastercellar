[project]
name = "mastercellar"
authors = [{ name = "Busuttil Technologies Limited" }]
description = "ERPNext-backed Master Cellar demonstration storefront"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
